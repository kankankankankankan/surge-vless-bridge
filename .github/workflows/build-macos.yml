name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/build-macos.yml'
      - 'desktop/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Intel x86_64
            runner: macos-15-intel
            arch: x64
            app-dir: mac
            executable-arch: x86_64
          - label: Apple Silicon arm64
            runner: macos-15
            arch: arm64
            app-dir: mac-arm64
            executable-arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build desktop resources
        run: npm run build:desktop

      - name: Package DMG
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Resolve artifact paths
        id: artifact
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          app="release/${{ matrix.app-dir }}/Surge VLESS Bridge.app"
          dmg="release/Surge VLESS Bridge-${version}-${{ matrix.arch }}.dmg"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "app=${app}" >> "$GITHUB_OUTPUT"
          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"

      - name: Verify packaged application
        shell: bash
        run: |
          npm run desktop:verify -- "${{ steps.artifact.outputs.app }}"
          SVB_PACKAGED_APP_DIR="${{ matrix.app-dir }}" npm run desktop:smoke
          codesign --verify --deep --strict --verbose=2 "${{ steps.artifact.outputs.app }}"
          executable="${{ steps.artifact.outputs.app }}/Contents/MacOS/Surge VLESS Bridge"
          file "$executable"
          file "$executable" | grep -q "${{ matrix.executable-arch }}"
          hdiutil verify "${{ steps.artifact.outputs.dmg }}"

      - name: Generate checksum
        shell: bash
        run: shasum -a 256 "${{ steps.artifact.outputs.dmg }}" > "${{ steps.artifact.outputs.dmg }}.sha256"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: surge-vless-bridge-${{ steps.artifact.outputs.version }}-${{ matrix.arch }}
          path: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.artifact.outputs.dmg }}.sha256
          if-no-files-found: error
          retention-days: 14
